[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Le service worker ne doit jamais être mis en cache par le CDN
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Photos des plats : mises en cache 7 jours par le navigateur et le CDN, rafraîchies en arrière-plan ensuite
[[headers]]
  for = "/dishes/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
